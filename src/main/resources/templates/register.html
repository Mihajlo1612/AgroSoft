<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agro Soft - Register</title>
    <link rel="stylesheet" th:href="@{/styles.css}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="logo">AgroSoft</div>
    <div class="input-form">
      <form method="post" th:action="@{/register}">
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1.5" y="3.5" width="13" height="9" rx="1.5" />
            <path d="M2 4.5l6 4.5 6-4.5" />
          </svg>
          <input type="email" name="email" id="email-input" placeholder="Email"/>
        </div>

        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0 1c-3 0-6 1.5-6 4v1h12v-1c0-2.5-3-4-6-4Z" />
          </svg>
          <input type="text" name="username" id="username-input" placeholder="Username ID"/>
        </div>

        <div class="input-group has-toggle">
          <svg class="input-icon" viewBox="0 0 16 16" fill="currentColor">
            <path d="M4 7V5a4 4 0 1 1 8 0v2h1v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7h1Zm2 0h4V5a2 2 0 1 0-4 0v2Z" />
          </svg>
          <input type="password" name="password" id="password-input" placeholder="Password"/>
          <button type="button" class="toggle-password" aria-label="Show password">
            <svg class="eye-icon" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 3C4.5 3 1.7 5.1 0 8c1.7 2.9 4.5 5 8 5s6.3-2.1 8-5c-1.7-2.9-4.5-5-8-5Zm0 8.3A3.3 3.3 0 1 1 8 4.7a3.3 3.3 0 0 1 0 6.6Zm0-1.3a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
              <line class="eye-slash-line" x1="1.5" y1="1.5" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div class="input-group has-toggle">
          <svg class="input-icon" viewBox="0 0 16 16" fill="currentColor">
            <path d="M4 7V5a4 4 0 1 1 8 0v2h1v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7h1Zm2 0h4V5a2 2 0 1 0-4 0v2Z" />
          </svg>
          <input type="password" name="confirmPassword" id="confirm-password-input" placeholder="Confirm Password"/>
          <button type="button" class="toggle-password" aria-label="Show password">
            <svg class="eye-icon" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 3C4.5 3 1.7 5.1 0 8c1.7 2.9 4.5 5 8 5s6.3-2.1 8-5c-1.7-2.9-4.5-5-8-5Zm0 8.3A3.3 3.3 0 1 1 8 4.7a3.3 3.3 0 0 1 0 6.6Zm0-1.3a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
              <line class="eye-slash-line" x1="1.5" y1="1.5" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <button class="btn-login" type="submit">REGISTER</button>
      </form>
    </div>
    <script th:src="@{/script.js}" defer></script>
  </body>
</html>
